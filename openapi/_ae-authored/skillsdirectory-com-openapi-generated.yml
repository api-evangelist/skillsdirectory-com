components:
  schemas:
    GetApiRegistryResponse:
      type: object
      properties:
        registry:
          type: string
        version:
          type: string
        skills:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              slug:
                type: string
              description:
                type: string
              repository:
                type: string
              category:
                type: string
              author:
                type: string
              stars:
                type: integer
              verified:
                type: boolean
              tags:
                type: array
                items:
                  type: string
        pagination:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
            hasMore:
              type: boolean
    GetApiRegistrySlugResponse:
      type: object
      properties:
        registry:
          type: string
        version:
          type: string
        skill:
          type: object
    PostApiV1ScanRequest:
      type: object
      properties:
        zip:
          type: string
          description: ZIP file containing skill
        content:
          type: string
          description: SKILL.md text content
        url:
          type: string
          description: Public GitHub link
    PostApiV1ScanResponse:
      type: object
      properties:
        data:
          type: object
          description: Scan results with findings
        meta:
          type: object
          description: Rate limit and tier information
    GetApiV1SkillsSlugResponse:
      type: object
      properties:
        data:
          type: object
          description: Skill details
        meta:
          type: object
          description: Rate limit and tier information
  securitySchemes:
    bearer:
