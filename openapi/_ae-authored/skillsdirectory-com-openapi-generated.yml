        description: Pagination offset
      - in: query
        name: verified
        required: false
        schema:
          type: boolean
        description: Filter verified skills only
      - in: query
        name: securityGrade
        required: false
        schema:
          type: string
        description: 'Max grade (A-F, default: A, ''all'' to disable)'
      - in: query
        name: minSecurityScore
        required: false
        schema:
          type: integer
        description: Minimum security score (0-100)
