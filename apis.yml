aid: skillsdirectory-com

name: Skills Directory

image: https://www.skillsdirectory.com/og-image.png

description: Skills Directory (skillsdirectory.com) is a security-first directory of agent skills for Claude, Claude Code and other coding agents.
  It indexes over 100,000 skills, scans each one automatically for credential reads, network exfiltration, unpinned remote code and prompt-injection
  vectors, and publishes a public A-F security grade. It offers a key-authenticated REST API (v1) for listing, searching and scanning skills,
  a public Registry API for CLI installers, live security-grade badges, and a hosted MCP server for Claude Code for Pro members.

