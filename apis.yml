- aid: skillsdirectory-com:skills-directory-api
  name: Skills Directory API
  description: Key-authenticated REST API (v1) to list, search (including Pro semantic search) and retrieve agent skills with their security grades,
    list categories, read key usage statistics, and scan a skill (ZIP, SKILL.md text or GitHub URL) for a security grade in CI. Free 100 requests/day,
    Pro 1,000, Enterprise 10,000. No machine-readable contract is published.
  humanURL: https://www.skillsdirectory.com/api-docs
